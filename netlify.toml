[build]
  command = "pnpm run build"
  publish = "dist/public"

# Every public page is pre-rendered at build time to its own HTML file
# (scripts/prerender.mjs), once per language: English at the unprefixed
# paths, Spanish under /es/ and Portuguese under /pt/ (same slugs).
# Each rule below serves that page's own file. "/" is served by index.html
# directly. The build fails if a pre-rendered route is missing here.
# Pages that exist in one language only (/clarity-matrix, /cost-of-clarity,
# /emotional-excellence, /iberoamerican-ethical-leadership) have no /es/ or
# /pt/ rule, so those URLs return the localized 404.
# Anything else falls through to the 404 rules at the end: the pre-rendered
# not-found page (in the URL's language) with HTTP status 404.

# --- English ---

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
  force = true

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200
  force = true

[[redirects]]
  from = "/services/individual-consultancy"
  to = "/services/individual-consultancy.html"
  status = 200
  force = true

[[redirects]]
  from = "/services/conferences-seminars"
  to = "/services/conferences-seminars.html"
  status = 200
  force = true

[[redirects]]
