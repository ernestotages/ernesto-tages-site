# Unknown URLs under a language prefix get the not-found page in that
# language, still with HTTP 404.

[[redirects]]
  from = "/es/*"
  to = "/es/404.html"
  status = 404

[[redirects]]
  from = "/pt/*"
  to = "/pt/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
