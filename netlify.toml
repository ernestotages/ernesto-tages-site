[build]
  command = "pnpm run build"
  publish = "dist/public"

# Every public page is pre-rendered at build time to its own HTML file
# (scripts/prerender.mjs). Each rule below serves that page's own file.
# "/" is served by index.html directly. The build fails if a pre-rendered
# route is missing here.
# Anything else falls through to the final rule: the pre-rendered
# not-found page with HTTP status 404.

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
  force = true

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200
  force = true

[[redirects]]
  from = "/services/individual-consultancy"
  to = "/services/individual-consultancy.html"
  status = 200
  force = true

